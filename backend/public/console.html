<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent system</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #14171f; --ink-2: #4a5263; --ink-3: #8089a0; --line: #e3e6ec;
    --brand: #2f6bff; --brand-soft: #e8efff; --good: #17924f; --good-soft: #e3f6ea; --bad: #cf3a3a; --bad-soft: #fde9e9;
    --warn: #a86400; --warn-soft: #fff2d9; --idle: #c4c9d4;
    --m1: #2f6bff; --m2: #b24ad6; --m3: #e2761b; --m4: #0e9e9a;
    --shadow: 0 1px 2px rgba(20,23,31,.06), 0 4px 14px rgba(20,23,31,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1016; --panel: #171a22; --ink: #eef0f5; --ink-2: #b3bac9; --ink-3: #7c8498; --line: #272b36;
      --brand: #6f97ff; --brand-soft: #1c2a4d; --good: #4cc98a; --good-soft: #143325; --bad: #ff7b7b; --bad-soft: #3a1a1c;
      --warn: #f0b24a; --warn-soft: #382a10; --idle: #3a4050;
      --m1: #6f97ff; --m2: #cf7bec; --m3: #f39a4b; --m4: #37c6c1;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }

  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  header h1 { font-size: 17px; letter-spacing: -.01em; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
  .pill.live { background: var(--good-soft); color: var(--good); }
  .runline { color: var(--ink-2); font-size: 13px; flex: 1; min-width: 200px; }
  .runline b { color: var(--ink); }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .btn:hover { border-color: var(--ink-3); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  .btn:disabled { opacity: .5; cursor: default; }

  main { display: grid; grid-template-columns: 290px minmax(0, 1fr) 380px; gap: 16px; padding: 16px 20px 40px; align-items: start; }
  @media (max-width: 1250px) { main { grid-template-columns: 270px minmax(0, 1fr); } .col-feed { grid-column: 1 / -1; } }
  @media (max-width: 780px) { main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 32px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; }
  .panel + .panel { margin-top: 12px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-bottom: 10px; }
  .hint { color: var(--ink-3); font-size: 12px; margin-top: 8px; }

  /* student */
  .who { font-weight: 700; font-size: 15px; }
  .sub { color: var(--ink-2); font-size: 13px; }
  .field { margin-top: 12px; }
  .field > label, .field > span.l { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
  select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  .check { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  .bars { display: grid; gap: 5px; }
  .bar { display: grid; grid-template-columns: 110px 1fr 34px; align-items: center; gap: 8px; font-size: 12.5px; }
  .bar span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 99px; background: var(--good); transition: width .4s; }
  .track.neg i { background: var(--bad); }
  .bar em { font-style: normal; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
  .dots { display: flex; gap: 6px; margin: 6px 0 2px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--idle); }
  .dots i.on { background: var(--brand); border-color: var(--brand); }
  .slotrow { display: flex; gap: 4px; margin-top: 4px; }
  .slot { flex: 1; height: 26px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }

  /* pipeline */
  .stage { position: relative; }
  .stage + .stage { margin-top: 26px; }
  .stage + .stage::before { content: ""; position: absolute; left: 50%; top: -26px; height: 26px; width: 2px; background: var(--line); }
  .stage.flow::before { background: linear-gradient(var(--brand), var(--brand)) 0 0 / 100% 40% no-repeat, var(--line); animation: flow 1s linear infinite; }
  @keyframes flow { from { background-position: 0 -12px, 0 0; } to { background-position: 0 28px, 0 0; } }
  .stage-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .stage-label span { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .node { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; border-left: 4px solid var(--idle); }
  .node.running { border-left-color: var(--brand); }
  .node.done { border-left-color: var(--good); }
  .node.failed { border-left-color: var(--bad); }
  .node-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .node-head h3 { font-size: 14.5px; }
  .node .role { color: var(--ink-3); font-size: 12.5px; }
  .node .detail { margin-top: 6px; color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
  .status { font-size: 12px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .status.running { color: var(--brand); } .status.running::before { background: var(--brand); animation: pulse 1s ease-in-out infinite; }
  .status.done { color: var(--good); } .status.done::before { background: var(--good); }
  .status.failed { color: var(--bad); } .status.failed::before { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--bg); color: var(--ink-2); border: 1px solid var(--line); }
  .tag.must { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
  .tag.avoid { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  .managers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 1500px) { .managers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .managers { grid-template-columns: minmax(0, 1fr); } }
  .managers .node { border-left-width: 1px; border-top: 4px solid var(--mc); }
  .mini { margin-top: 8px; font-size: 12px; color: var(--ink-3); }

  .fleet { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; }
  .jobs { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
  .job { max-width: 230px; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 6px; border-radius: 7px; font-size: 12px; border: 1px solid var(--line); border-left: 4px solid var(--mc); background: var(--bg); color: var(--ink-3); transition: background .25s, color .25s; }
  .job b { font-size: 10px; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; background: var(--line); color: var(--ink-2); flex: none; }
  .job span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job.running { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); border-left-color: var(--mc); animation: glow 1.1s ease-in-out infinite; }
  .job.done { color: var(--ink); background: var(--panel); }
  .job.done b { background: var(--good-soft); color: var(--good); }
  .job.failed { background: var(--bad-soft); color: var(--bad); }
  .job.skipped { text-decoration: line-through; opacity: .55; }
  @keyframes glow { 50% { box-shadow: 0 0 0 3px var(--brand-soft); } }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 12px; color: var(--ink-3); }
  .legend b { color: var(--ink-2); }

  .vals { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px; }
  .val { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; font-size: 12.5px; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; }
  .val i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; color: #fff; background: var(--idle); }
  .val.checking i { background: var(--brand); animation: pulse 1s ease-in-out infinite; }
  .val.kept i { background: var(--good); } .val.rejected i { background: var(--bad); }
  .val strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .val small { grid-column: 2; color: var(--ink-3); font-size: 11.5px; }
  .val.rejected small { color: var(--bad); }

  .empty { text-align: center; color: var(--ink-3); padding: 44px 16px; border: 1px dashed var(--line); border-radius: 12px; }
  .log { max-height: 250px; overflow: auto; font-size: 12.5px; display: grid; gap: 3px; }
  .log div { display: grid; grid-template-columns: 62px 150px 1fr; gap: 8px; }
  @media (max-width: 780px) { .log div { grid-template-columns: 1fr; gap: 0; margin-bottom: 4px; } }
  .log time { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .log b { color: var(--ink-2); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log .good span { color: var(--good); } .log .bad span { color: var(--bad); }

  /* feed */
  .feed { display: grid; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 13px; }
  .card.new { border-color: var(--brand); }
  .card-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .type { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--brand); }
  .newtag { font-size: 10.5px; font-weight: 700; background: var(--brand); color: #fff; padding: 1px 7px; border-radius: 99px; }
  .card h3 { font-size: 14.5px; margin-top: 3px; }
  .card .org { color: var(--ink-2); font-size: 12.5px; }
  .why { margin-top: 7px; font-size: 13px; color: var(--ink); background: var(--bg); border-radius: 8px; padding: 6px 9px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 7px; font-size: 12px; color: var(--ink-2); }
  .meta .unknown { color: var(--warn); font-weight: 600; }
  .score { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-top: 8px; font-size: 11.5px; color: var(--ink-3); }
  .score .track i { background: var(--brand); }
  .up { color: var(--good); font-weight: 700; } .down { color: var(--bad); font-weight: 700; }
  .actions { display: flex; gap: 6px; margin-top: 9px; }
  .actions button { flex: 1; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 5px 0; cursor: pointer; font-size: 12.5px; font-weight: 600; }
  .actions button:hover { border-color: var(--ink-3); }
  .actions .like.on { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .actions .save.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  .actions .dislike:hover { border-color: var(--bad); color: var(--bad); }
  details { margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
  details summary { cursor: pointer; color: var(--ink-3); }
  details ul { margin: 6px 0 0; padding-left: 18px; }
  a { color: var(--brand); }
</style>
</head>
<body>
<header>
  <h1>Agent system</h1>
  <span class="pill" id="mode">Connecting…</span>
  <div class="runline" id="runline"></div>
  <button class="btn" id="auto" title="Start a run on a timer, with nobody asking">Auto-run: off</button>
  <button class="btn primary" id="start">Start a run</button>
  <button class="btn" id="reset">Reset</button>
</header>

<main>
  <div class="col-student">
    <section class="panel" id="student"></section>
    <section class="panel" id="memory"></section>
  </div>
  <div class="col-run">
    <div id="pipeline"></div>
    <section class="panel" style="margin-top:26px">
      <h2>Activity log</h2>
      <div class="log" id="log"></div>
    </section>
  </div>
  <div class="col-feed">
    <section class="panel" style="background:transparent;border:0;box-shadow:none;padding:0">
      <h2 id="feedtitle">The student's feed</h2>
      <div class="feed" id="feed"></div>
    </section>
  </div>
</main>

<script>
const API = '/api/students/demo';
const INTERESTS = ['coding', 'data', 'AI', 'design', 'security', 'hardware', 'biology', 'finance', 'product'];
const CATEGORIES = [['internship', 'Internships'], ['event', 'Events and networking'], ['club', 'Clubs and communities'], ['program', 'Programs (research, scholarships, hackathons)']];
const CAT_SHORT = { internship: 'Internships', event: 'Events', club: 'Clubs', program: 'Programs' };
const TRIGGERS = { first: 'first run', manual: 'started by hand', profile: 'started itself: profile changed', feedback: 'started itself: new reactions', schedule: 'started itself: schedule', fill: 'started itself: the feed was short' };
const KIND = { scout: ['S', 'Scout: searches for leads'], extract: ['R', 'Reader: opens a page and extracts the details'], application: ['A', 'Application reader: collects prompts and materials'] };
let student = null, run = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => (/^https?:\/\//i.test(u || '') ? esc(u) : '#');
const post = (path, body, method = 'POST') => fetch(API + path, { method, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body ?? {}) });
const mcolor = (id) => `var(--m${((Number(String(id).split('-')[1]) - 1) % 4) + 1})`;

function due(o) {
  if (!o.deadline) return `<span class="unknown">${esc(o.unknowns[0]?.label ?? 'Deadline unknown')}</span>`;
  const days = Math.ceil((Date.parse(o.deadline) - Date.now()) / 864e5);
  return `<span>Due in ${days} day${days === 1 ? '' : 's'}</span>`;
}

function renderHeader() {
  if (!student) return;
  const mode = $('mode');
  mode.textContent = student.mode !== 'live' ? 'Simulated agents · sample data' : student.provider === 'claude' ? 'Live agents on Claude (test)' : 'Live Grok agents';
  mode.className = 'pill' + (student.mode === 'live' ? ' live' : '');
  $('auto').textContent = student.scheduleSeconds ? `Auto-run: every ${student.scheduleSeconds}s` : 'Auto-run: off';
  $('auto').className = 'btn' + (student.scheduleSeconds ? ' on' : '');
  const busy = run?.status === 'running';
  $('start').disabled = busy;
  $('start').textContent = busy ? 'Agents working…' : 'Start a run';
  if (!run) { $('runline').innerHTML = 'No run yet.'; return; }
  const s = run.stats;
  const secs = Math.max(0, Math.round(((run.finishedAt ? Date.parse(run.finishedAt) : Date.now()) - Date.parse(run.startedAt)) / 1000));
  $('runline').innerHTML = `<b>Run ${run.number}</b> · ${esc(TRIGGERS[run.trigger])} · ${run.status === 'running' ? 'running' : esc(run.status)} · ${secs}s` +
    (run.status !== 'running' ? ` · ${s.jobs} worker jobs · kept ${s.kept}, rejected ${s.rejected} · ${s.added} new` : '');
}

function renderStudent() {
  if (!student) return;
  const p = student.profile;
  const has = (list, v) => list.map((x) => x.toLowerCase()).includes(v.toLowerCase());
  $('student').innerHTML = `
    <h2>Student profile</h2>
    <div class="who">${esc(p.name)}</div>
    <div class="sub">${esc(p.major)} · ${esc(p.school)} · ${esc(p.location)}</div>
    <div class="field"><label for="year">Class year</label>
      <select id="year">${['Freshman', 'Sophomore', 'Junior', 'Senior'].map((y) => `<option ${y === p.year ? 'selected' : ''}>${y}</option>`).join('')}</select></div>
    <div class="field"><span class="l">Interests</span>
      <div class="chips">${INTERESTS.map((i) => `<button class="chip ${has(p.interests, i) ? 'on' : ''}" data-interest="${esc(i)}">${esc(i)}</button>`).join('')}</div></div>
    <div class="field"><span class="l">Search for</span>
      ${CATEGORIES.map(([id, label]) => `<label class="check"><input type="checkbox" data-category="${id}" ${p.categories.includes(id) ? 'checked' : ''}> ${esc(label)}</label>`).join('')}</div>
    <div class="field"><label class="check"><input type="checkbox" id="remote" ${p.remoteOk ? 'checked' : ''}> Open to remote</label></div>
    <p class="hint">Change anything here and the agents start a new run on their own.</p>`;

  const m = student.memory;
  const max = Math.max(1, ...m.likes.map((l) => l.weight), ...m.dislikes.map((d) => -d.weight));
  const bars = (list, neg) => list.length
    ? `<div class="bars">${list.map((e) => `<div class="bar"><span title="${esc(e.feature)}">${esc(e.feature)}</span><div class="track ${neg ? 'neg' : ''}"><i style="width:${Math.min(100, Math.abs(e.weight) / max * 100)}%"></i></div><em>${e.weight > 0 ? '+' : ''}${e.weight}</em></div>`).join('')}</div>`
    : `<p class="sub">Nothing yet.</p>`;
  const total = Object.values(m.categoryWeights).reduce((a, b) => a + b, 0) || 1;
  const dots = Array.from({ length: student.feedbackThreshold }, (_, i) => `<i class="${i < student.feedbackSinceRun ? 'on' : ''}"></i>`).join('');
  $('memory').innerHTML = `
    <h2>Memory the master agent reads</h2>
    <div class="field" style="margin-top:0"><span class="l">Learned likes</span>${bars(m.likes, false)}</div>
    <div class="field"><span class="l">Learned dislikes</span>${bars(m.dislikes, true)}</div>
    ${m.avoidFields.length ? `<div class="field"><span class="l">Agents told to stop searching for</span><div class="tags" style="margin:0">${m.avoidFields.map((f) => `<span class="tag avoid">${esc(f)}</span>`).join('')}</div></div>` : ''}
    <div class="field"><span class="l">Reactions until the next automatic run</span><div class="dots">${dots}</div>
      <p class="sub">${student.feedbackSinceRun} of ${student.feedbackThreshold}. Like, dislike or save cards in the feed.</p></div>
    <div class="field"><span class="l">Engagement by category</span>
      <div class="bars">${Object.entries(m.categoryWeights).map(([c, w]) => `<div class="bar"><span>${CAT_SHORT[c]}</span><div class="track"><i style="width:${w / total * 100}%;background:var(--brand)"></i></div><em>${w ? w.toFixed(1) : 'off'}</em></div>`).join('')}</div>
      <p class="hint">This decides how many search managers each category gets.</p></div>`;
}

function nodeHtml(n, extra = '', style = '') {
  const label = { running: 'Working', done: 'Done', failed: 'Failed', idle: 'Waiting' }[n.status];
  return `<div class="node ${n.status}" style="${style}"><div class="node-head"><h3>${esc(n.name)}</h3><span class="status ${n.status}">${label}</span></div>
    <div class="role">${esc(n.role)}</div><div class="detail">${esc(n.detail)}</div>${extra}</div>`;
}

function renderPipeline() {
  const el = $('pipeline');
  if (!run) { el.innerHTML = `<div class="empty"><b>No run yet.</b><br>Press “Start a run” to watch the agents work.</div>`; $('log').innerHTML = ''; return; }
  const byId = Object.fromEntries(run.agents.map((a) => [a.id, a]));
  const master = byId.master;
  const managers = run.agents.filter((a) => a.level === 'manager');
  const presenter = byId.presentation;
  const jobs = run.jobs;
  const count = (st) => jobs.filter((j) => j.status === st).length;
  const brief = run.brief;
  const masterExtra = brief ? `<div class="tags">${brief.hardCriteria.map((c) => `<span class="tag must">must: ${esc(c)}</span>`).join('')}${brief.avoid.map((c) => `<span class="tag avoid">avoid: ${esc(c)}</span>`).join('')}</div>` : '';

  const slots = run.assignments.length ? `<div class="slotrow">${run.assignments.map((a) => `<div class="slot" style="background:${mcolor(a.managerId)}" title="${esc(a.name)}">${esc(CAT_SHORT[a.category])}</div>`).join('')}</div>` : '';

  const managerHtml = managers.map((m) => {
    const a = run.assignments.find((x) => x.managerId === m.id);
    const mine = jobs.filter((j) => j.managerId === m.id && j.kind !== 'application');
    const done = mine.filter((j) => j.status === 'done').length;
    return nodeHtml(m, `<div class="tags">${(a?.focus ?? []).map((f) => `<span class="tag">${esc(f)}</span>`).join('')}</div><div class="mini">${mine.length ? `${done} of ${mine.length} worker jobs done` : 'no workers yet'}</div>`, `--mc:${mcolor(m.id)}`);
  }).join('');

  const jobHtml = jobs.map((j) => {
    const owner = run.assignments.find((a) => a.managerId === j.managerId || a.name === j.managerId);
    const [letter, what] = KIND[j.kind];
    return `<div class="job ${j.status}" style="--mc:${mcolor(owner?.managerId ?? 'manager-1')}" title="${esc(what)}\n${esc(j.label)}\n${esc(j.status)}${j.result ? ': ' + esc(j.result) : ''}${j.attempts > 1 ? ' (retried)' : ''}"><b>${letter}</b><span>${esc(j.label.replace(/^(Search|Read|Application): /, ''))}</span></div>`;
  }).join('');

  const vals = run.validations.map((v) => {
    const mark = v.status === 'kept' ? '✓' : v.status === 'rejected' ? '✕' : '…';
    const reviews = (v.reviews ?? []).map((r) => `${r.reviewer.replace(' reviewer', '')}: ${r.status === 'checking' ? 'reviewing…' : r.status}`).join(' · ');
    const line = v.status === 'kept' ? `Kept by both · fit ${v.fit} · ${reviews}` : v.status === 'rejected' ? v.reason : reviews || 'Reviewing…';
    return `<div class="val ${v.status}"><i>${mark}</i><strong title="${esc(v.title)}">${esc(v.title)}</strong><small>${esc(line)}</small></div>`;
  }).join('');

  const fleetActive = count('running') > 0;
  const valActive = run.validations.some((v) => v.status === 'checking');
  el.innerHTML = `
    <div class="stage"><div class="stage-label">1 · Master agent <span>reads the student, briefs the managers</span></div>
      ${master ? nodeHtml(master, masterExtra + slots) : ''}</div>
    <div class="stage ${managers.some((m) => m.status === 'running') ? 'flow' : ''}"><div class="stage-label">2 · Search managers <span>${managers.length} running in parallel, each with its own slice</span></div>
      <div class="managers">${managerHtml || '<div class="sub">Waiting for the master agent…</div>'}</div></div>
    <div class="stage ${fleetActive ? 'flow' : ''}"><div class="stage-label">3 · Worker fleet <span>${count('running')} working · ${count('done')} done · ${count('queued')} queued${count('skipped') ? ` · ${count('skipped')} over budget` : ''}${count('failed') ? ` · ${count('failed')} failed` : ''}</span></div>
      <div class="fleet"><div class="jobs">${jobHtml || '<span class="sub">No jobs yet.</span>'}</div>
      <div class="legend"><span><b>S</b> scout: searches for leads</span><span><b>R</b> reader: extracts a posting's details</span><span><b>A</b> application reader</span><span>Colour = the manager that ordered the job</span></div></div></div>
    <div class="stage ${valActive ? 'flow' : ''}"><div class="stage-label">4 · Validation agents <span>${run.validations.length ? `kept ${run.validations.filter((v) => v.status === 'kept').length} · rejected ${run.validations.filter((v) => v.status === 'rejected').length} · checking ${run.validations.filter((v) => v.status === 'checking').length}` : 'one per posting, against the student’s criteria'}</span></div>
      ${vals ? `<div class="vals">${vals}</div>` : '<div class="sub">Waiting for the workers…</div>'}</div>
    <div class="stage ${presenter?.status === 'running' ? 'flow' : ''}"><div class="stage-label">5 · Presentation manager <span>orders the feed, writes the reasons</span></div>
      ${presenter ? nodeHtml(presenter) : '<div class="sub">Waiting for validation…</div>'}</div>`;

  const log = $('log');
  const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  log.innerHTML = run.log.map((l) => `<div class="${l.tone}"><time>${new Date(l.at).toLocaleTimeString([], { hour12: false })}</time><b title="${esc(l.agent)}">${esc(l.agent)}</b><span>${esc(l.text)}</span></div>`).join('');
  if (stick) log.scrollTop = log.scrollHeight;
}

function renderFeed() {
  if (!student) return;
  const el = $('feed');
  const before = new Map([...el.querySelectorAll('.card')].map((c) => [c.dataset.id, c.getBoundingClientRect().top]));
  $('feedtitle').textContent = `The student's feed · ${student.feed.length}`;
  if (!student.feed.length) { el.innerHTML = `<div class="empty">Nothing yet. Opportunities appear here once a run finishes.</div>`; return; }
  const top = Math.max(...student.feed.map((f) => f.score), 0.01);
  el.innerHTML = student.feed.map((f) => {
    const o = f.opportunity;
    const pull = Math.abs(f.affinity) < 0.05 ? 'no history yet' : `<span class="${f.affinity > 0 ? 'up' : 'down'}">${f.affinity > 0 ? '▲' : '▼'} ${Math.abs(f.affinity).toFixed(2)}</span> from your reactions`;
    const app = o.application && o.application.prompts.length ? `<details><summary>Application: ${o.application.prompts.length} prompt${o.application.prompts.length === 1 ? '' : 's'}${o.application.materials.length ? ', ' + o.application.materials.length + ' materials' : ''}</summary><ul>${o.application.prompts.map((p) => `<li>${esc(p)}</li>`).join('')}${o.application.materials.map((p) => `<li>Needs: ${esc(p)}</li>`).join('')}</ul></details>` : '';
    return `<article class="card ${f.isNew ? 'new' : ''}" data-id="${esc(o.id)}">
      <div class="card-top"><span class="type">${esc(o.type)}</span>${f.isNew ? '<span class="newtag">NEW</span>' : ''}</div>
      <h3>${esc(o.title)}</h3>
      <div class="org">${esc(o.organizer)} · ${o.format === 'online' ? 'Remote' : esc(o.location ?? 'Location unknown')}</div>
      <div class="why"><b>Why you're seeing this:</b> ${esc(f.reason)}</div>
      <div class="meta">${due(o)}<span>${esc(o.eligibility ?? '')}</span><span>Found by ${esc(o.foundBy)}</span><a href="${safeUrl(o.sourceUrl)}" target="_blank" rel="noopener">Official page</a></div>
      <div class="score"><div class="track"><i style="width:${Math.max(4, f.score / top * 100)}%"></i></div><span>score ${f.score.toFixed(2)} · ${pull}</span></div>
      <div class="actions">
        <button class="like ${f.reaction === 'like' ? 'on' : ''}" data-act="like">${f.reaction === 'like' ? 'Liked' : 'Like'}</button>
        <button class="dislike" data-act="dislike">Dislike</button>
        <button class="save ${f.saved ? 'on' : ''}" data-act="save">${f.saved ? 'Saved' : 'Save'}</button>
      </div>${app}</article>`;
  }).join('');
  // Slide cards from their old place to their new one, so a re-rank is visible.
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (const card of el.querySelectorAll('.card')) {
    const old = before.get(card.dataset.id);
    const now = card.getBoundingClientRect().top;
    if (old === undefined) { card.animate([{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 350, easing: 'ease-out' }); continue; }
    if (Math.abs(old - now) > 2) card.animate([{ transform: `translateY(${old - now}px)` }, { transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
}

// ---- events ---------------------------------------------------------------
document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.act) return void post('/interactions', { opportunityId: t.closest('.card').dataset.id, action: t.dataset.act });
  if (t.dataset.interest) {
    const v = t.dataset.interest, cur = student.profile.interests;
    const next = cur.some((x) => x.toLowerCase() === v.toLowerCase()) ? cur.filter((x) => x.toLowerCase() !== v.toLowerCase()) : [...cur, v];
    if (next.length) post('/profile', { interests: next }, 'PUT');
    return;
  }
  if (t.id === 'start') return void post('/runs');
  if (t.id === 'reset') return void post('/reset');
  if (t.id === 'auto') return void post('/schedule', { seconds: student.scheduleSeconds ? 0 : 45 }, 'PUT');
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'year') post('/profile', { year: t.value }, 'PUT');
  if (t.id === 'remote') post('/profile', { remoteOk: t.checked }, 'PUT');
  if (t.dataset.category) {
    const next = [...document.querySelectorAll('[data-category]')].filter((c) => c.checked).map((c) => c.dataset.category);
    if (next.length) post('/profile', { categories: next }, 'PUT'); else t.checked = true;
  }
});

const stream = new EventSource(API + '/stream');
stream.addEventListener('student', (e) => { student = JSON.parse(e.data); renderHeader(); renderStudent(); renderFeed(); });
stream.addEventListener('run', (e) => { run = JSON.parse(e.data); renderHeader(); renderPipeline(); });
stream.onerror = () => { $('mode').textContent = 'Disconnected, retrying…'; };
setInterval(() => { if (run?.status === 'running') renderHeader(); }, 1000);
renderPipeline();
</script>
</body>
</html>
