<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to BearRok</title>
<style>
  :root { --ink: #152b43; --ink-2: #4a5b70; --brand: #245bd8; --line: #d9e1ec; --bg: #f3f7fc; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 32px; text-align: center; box-shadow: 0 10px 40px rgb(21 43 67 / .08); }
  .mark { width: 44px; height: 44px; border-radius: 12px; background: var(--brand); color: #fff; display: grid; place-items: center; font: italic 26px Georgia, serif; margin: 0 auto 16px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { margin: 0; color: var(--ink-2); }
  button { margin-top: 22px; width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { border-color: #b9c6d8; background: #f6f9fd; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; font-size: 14.5px; min-height: 22px; }
  .bad { color: #b42318; } .good { color: #0f7a43; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="mark">b.</div>
  <h1 id="title">Sign in to BearRok</h1>
  <p id="sub">Finish here, then go back to the app.</p>
  <button id="go" disabled>Loading…</button>
  <p class="msg" id="msg" aria-live="polite"></p>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const session = params.get('session') ?? '';
const provider = params.get('provider') === 'x' ? 'x' : 'google';
const label = provider === 'x' ? 'X' : 'Google';
const fail = (text) => { $('msg').className = 'msg bad'; $('msg').textContent = text; };

async function main() {
  if (!/^[a-f0-9]{64}$/.test(session)) return fail('This link is not valid. Go back to the app and click the sign-in button again.');
  const cfg = await fetch('/api/auth/config').then((r) => r.json());
  if (!cfg.enabled) return fail('Sign-in is not set up on this server.');
  const [{ initializeApp }, fb] = await Promise.all([
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
  ]);
  // Its own app name and no saved session: this page only passes the result on to the desktop app.
  const auth = fb.initializeAuth(initializeApp(cfg.firebase, 'desktop-handoff'), { persistence: fb.inMemoryPersistence, popupRedirectResolver: fb.browserPopupRedirectResolver });
  const Provider = provider === 'x' ? fb.TwitterAuthProvider : fb.GoogleAuthProvider;
  // Extra Google permissions the app asked for, by short name. Anything not on this list is ignored.
  const SCOPES = { calendar: 'https://www.googleapis.com/auth/calendar.events', sheets: 'https://www.googleapis.com/auth/spreadsheets' };
  const wanted = (params.get('scopes') ?? '').split(',').filter((s) => provider === 'google' && SCOPES[s]);
  if (wanted.length) {
    $('title').textContent = `Connect Google ${wanted.map((s) => (s === 'calendar' ? 'Calendar' : 'Sheets')).join(' and ')}`;
    $('sub').textContent = 'Google will ask you to allow it. Then go back to the app.';
  }

  const go = $('go');
  go.textContent = `Continue with ${label}`;
  go.disabled = false;
  go.onclick = async () => {
    $('msg').textContent = '';
    try {
      const request = new Provider();
      for (const name of wanted) request.addScope(SCOPES[name]);
      const result = await fb.signInWithPopup(auth, request);
      const cred = Provider.credentialFromResult(result);
      const res = await fetch(`/api/auth/desktop/${session}`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ provider, idToken: cred?.idToken ?? null, accessToken: cred?.accessToken ?? null, secret: cred?.secret ?? null }),
      });
      if (!res.ok) throw new Error(res.status === 409 ? 'used' : 'handoff');
      go.style.display = 'none';
      $('title').textContent = wanted.length ? 'Connected' : 'You are signed in';
      $('sub').textContent = 'Go back to the BearRok app. You can close this tab.';
      $('msg').className = 'msg good';
      $('msg').textContent = 'Done.';
    } catch (e) {
      // Closing Google's window is not an error: the button simply stays ready.
      if (e?.code === 'auth/popup-closed-by-user' || e?.code === 'auth/cancelled-popup-request') return;
      if (e?.message === 'used') return fail('This sign-in link was already used. Go back to the app and click the button again.');
      if (e?.code === 'auth/operation-not-allowed') return fail(`${label} sign-in is not switched on yet.`);
      if (e?.code === 'auth/popup-blocked') return fail('Your browser blocked the sign-in window. Allow pop-ups for this page and click again.');
      fail('Sign-in did not work. Click the button to try again.');
    }
  };
}
main().catch(() => fail('Could not load sign-in. Check that the BearRok backend is running, then reload.'));
</script>
</body>
</html>
